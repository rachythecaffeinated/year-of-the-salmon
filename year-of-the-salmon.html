<style>
:root{--river:#071a21;--roe:#d9542b;--scale:#7fb6a8;--silt:#ede6d8;--bone:#a8b5ae}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--river);color:var(--silt);min-height:100vh;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  display:flex;align-items:center;justify-content:center;padding:2rem;line-height:1.55;
}
.box{max-width:34rem}
.eyebrow{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.66rem;
  letter-spacing:.28em;text-transform:uppercase;color:var(--scale);margin-bottom:1rem;
}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:400;line-height:1;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--roe)}
p{color:var(--bone);margin-top:1.1rem;font-size:1rem;max-width:46ch}
a.cta{
  display:inline-block;margin-top:1.8rem;padding:.8rem 1.6rem;background:var(--roe);
  color:#fff;text-decoration:none;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
}
a.cta:hover{background:#ef6d40}
.small{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.66rem;letter-spacing:.1em;
  color:var(--bone);margin-top:1.6rem;word-break:break-all;
}
.small a{color:var(--scale)}
</style>

<div class="box">
  <div class="eyebrow">Year of the Salmon</div>
  <h1>The board <em>moved</em>.</h1>
  <p>
    This page can't reach the shared log — Claude artifacts block requests to
    outside services, so the calendar and everyone's entries live somewhere else now.
  </p>
  <a class="cta" href="https://rachythecaffeinated.github.io/year-of-the-salmon/">Go to the board</a>
  <p class="small">
    rachythecaffeinated.github.io/year-of-the-salmon
  </p>
</div>
